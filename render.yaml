services:
  - type: web
    name: fastapi-stack-check
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fastapi-demo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: fastapi-demo-redis
          property: connectionString
      - key: ENVIRONMENT
        value: prod

  - type: pserv
    name: fastapi-demo-db
    plan: free
    databaseName: fastapi_demo
    user: postgres
    ipAllowList: []

  - type: redis
    name: fastapi-demo-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []