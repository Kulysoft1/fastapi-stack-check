[project]
name = "fastapi-stack-check"
version = "0.1.0"
description = "Minimal FastAPI app with PostgreSQL and Redis for Render and Railway deployment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis>=5.1.0",
    "pydantic-settings>=2.5.0",
    "pydantic>=2.9.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "alembic"]

[tool.uv]
dev-dependencies = []

[tool.alembic]
script_location = "alembic"
prepend_sys_path = "."

[tool.pytest.ini_options]
asyncio_mode = "auto"
